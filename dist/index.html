<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a1411">
  <meta name="description" content="Play and mix rain, ocean, fire and noise into a calm, moonlit sleep soundscape — offline.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Sleep Sounds</title>
  <link rel="stylesheet" href="style.css?v=13">
</head>
<body>
  <main>
    <header>
      <img src="icon-192.png" width="40" height="40" alt="">
      <div class="brand">
        <h1>Sleep Sounds</h1>
        <p class="tagline">Night air, softly mixed.</p>
      </div>
    </header>

    <section class="player" aria-label="Sound player">
      <button type="button" class="play" id="play">
        <span id="playIcon" aria-hidden="true">▶</span>
        <span id="playText">Play</span>
      </button>
      <p id="status" class="note" role="status"></p>

      <div class="timer">
        <label class="control-row" for="timerMinutes">
          Timer
          <select id="timerMinutes" aria-describedby="timerStatus"></select>
        </label>
        <label class="control-row" id="timerFadeControl" for="timerFade" hidden>
          Fade out
          <select id="timerFade"></select>
        </label>
        <p id="timerStatus" class="note" role="timer" aria-live="off"></p>
      </div>

      <div class="sounds-heading">
        <h2 id="soundsHeading">Sounds</h2>
        <p>Tap to toggle · Drag for volume</p>
      </div>
      <div class="sound-tiles" id="soundLibrary" role="group" aria-labelledby="soundsHeading"></div>

      <details>
        <summary id="presetsHeading">Presets</summary>
        <div class="details-content presets" id="soundPresets" role="group" aria-labelledby="presetsHeading"></div>
      </details>

      <details>
        <summary>Saved mixes</summary>
        <div class="details-content">
          <fieldset id="savedMixes" class="saved-mix-panel" aria-label="Saved mix controls">
            <ul id="savedMixList" class="saved-mix-list"></ul>
            <form class="saved-mix-form" id="savedMixForm">
              <label for="savedMixName">Mix name
                <input id="savedMixName" type="text" autocomplete="off">
              </label>
              <button id="savedMixSubmit" type="submit">Save mix</button>
              <button id="savedMixCancel" type="button" hidden>Cancel</button>
            </form>
            <p id="savedMixStatus" class="note" role="status"></p>
          </fieldset>
        </div>
      </details>

      <details>
        <summary>Settings</summary>
        <div class="details-content settings">
          <div>
            <label class="control-row" for="playbackMode">
              Playback
              <select id="playbackMode" aria-describedby="modeNote">
                <option value="gapless">Gapless</option>
                <option value="screen-off">Screen-off</option>
              </select>
            </label>
            <p id="modeNote" class="note"></p>
          </div>

          <div class="track">
            <label for="boost">Volume boost</label>
            <output id="boostValue" for="boost">100%</output>
            <input id="boost" type="range" min="100" max="150" step="5" value="100" aria-describedby="boostNote">
            <p id="boostNote" class="note"></p>
          </div>

          <div>
            <div class="utility">
              <button type="button" id="offline">Save offline</button>
              <button type="button" id="install">Install app</button>
            </div>
            <p id="offlineStatus" class="note" role="status"></p>
            <p id="installStatus" class="note" role="status"></p>
          </div>

          <details>
            <summary>Sound credits</summary>
            <div class="details-content credits">
              <p class="note">Recordings are CC0. Noise tracks are generated.</p>
              <ul id="audioCredits"></ul>
            </div>
          </details>
        </div>
      </details>
    </section>

    <template id="soundControl">
      <div class="sound-tile">
        <button type="button" class="sound-button" aria-pressed="false">
          <span class="sound-name"></span>
          <span class="sound-level" aria-hidden="true"></span>
          <span class="sound-meter" aria-hidden="true"></span>
        </button>
        <input type="range" min="0" max="100" value="0">
      </div>
    </template>
  </main>

  <audio id="mixAudio" loop preload="auto" playsinline></audio>
  <script src="sound-library.js?v=8"></script>
  <script src="player-config.js?v=13"></script>
  <script src="native-mix.js?v=9"></script>
  <script src="master-mix.js?v=8"></script>
  <script src="gapless-player.js?v=9"></script>
  <script src="session-settings.js?v=9"></script>
  <script src="audio-sleep-timer.js?v=9"></script>
  <script src="saved-mixes.js?v=10"></script>
  <script src="app.js?v=11"></script>
</body>
</html>
